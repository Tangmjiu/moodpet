name: pocketclaw
description: >-
  PocketClaw — a local-first agent framework for Dart/Flutter. Combines
  on-device decision routing with cloud LLM invocation and an extensible
  tool system. This local package ships the native `PocketClaw` API used by
  MoodPet.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  crypto: ^3.0.3
