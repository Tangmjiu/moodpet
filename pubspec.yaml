name: moodpet
description: "MoodPet — 一切皆插件的开源共生情感体平台 (Flutter + Material Design 3)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — clean architecture, immutable state.
  flutter_riverpod: ^2.6.1

  # Storage & filesystem — plugin directories, settings, API keys.
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Networking — LLM provider calls (PocketClaw default agent).
  http: ^1.3.0

  # Provider logo icons (SVG) — rendered in provider selection / detail UI.
  flutter_svg: ^2.3.0

  # Identity — plugin instance / session ids.
  uuid: ^4.5.1

  # Pack installation — unpacking .moodpack archives [社区 distribution format].
  archive: ^3.6.1

  # Utilities.
  collection: ^1.18.0
  meta: ^1.15.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Bundled default Friend plugin (system, non-uninstallable). Extracted to the
  # user plugin directory on first run by PluginBootstrap. Directory entries are
  # non-recursive, so the plugin's nested assets/ dir is declared explicitly.
  assets:
    - assets/plugins/moodpet.friend.default_smiley.moodfriend/
    - assets/plugins/moodpet.friend.default_smiley.moodfriend/assets/
    - assets/icons/providers/
