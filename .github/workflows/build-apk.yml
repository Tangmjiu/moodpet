name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile MoodPet Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifacts
        run: |
          mkdir -p apk-artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk apk-artifacts/MoodPet-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk apk-artifacts/MoodPet-release.apk
          ls -lh apk-artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoodPet-APKs
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk-artifacts/MoodPet-release.apk
            apk-artifacts/MoodPet-debug.apk
          name: ${{ github.ref_name }}
          generate_release_notes: false
